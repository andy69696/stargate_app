# Databricks Apps manifest for Stargate Workspace v2 (FastAPI serving the artifact's own pages; see server.py).
# Resources: add a SQL warehouse resource named "sql-warehouse" to the app in the Databricks UI (Apps > this app > Resources)
# and the app's service principal gets CAN_USE on it; the warehouse id is injected below.
command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
# The earlier Streamlit port is still in the folder; to deploy it instead, use:
# command: ["streamlit", "run", "app.py", "--server.port", "8000", "--server.address", "0.0.0.0", "--server.headless", "true"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse            # app resource key (SQL warehouse)
  - name: KANTATA_CATALOG
    value: "salesforce_dev"             # Kantata (Salesforce) bronze: same object and field names as Salesforce, lower-cased
  - name: KANTATA_SCHEMA
    value: "bronze"
  - name: HUBSPOT_DEALS_TABLE
    value: "hubspot_dev.silver.deals"   # TODO(databricks): the HubSpot deals table for the Not detailed tab (see queries.hubspot_deals)
  - name: APP_STATE_SCHEMA
    value: "salesforce_dev.stargate_app" # TODO(databricks): schema the app may write to (workspace_db, resourcing_history; Streamlit also uses exception_ledger, rm_actions)
  - name: LLM_ENDPOINT
    value: "ubds_ai_models.default.gpt_apikey_test"   # Explain and Ask: the AI Gateway model provider service (llm.py)
  - name: LLM_KIND
    value: "model_provider_service"                  # or uc_function / serving_endpoint / auto
  - name: LLM_MODEL
    value: "gpt-5-nano"                              # the model the provider service allows
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
